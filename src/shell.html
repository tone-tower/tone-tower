<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#19293d" />
    <meta name="description" content="{{description}}" />
    <title>{{title}}</title>
    <link rel="canonical" href="{{canonical}}" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" sizes="180x180" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tone Tower" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta
      property="og:image"
      content="https://tone-tower.github.io/tone-tower/assets/brand/share-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{shareAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta
      name="twitter:image"
      content="https://tone-tower.github.io/tone-tower/assets/brand/share-card.png"
    />
    <meta name="twitter:image:alt" content="{{shareAlt}}" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="stylesheet" href="src/styles/worlds.css" />
  </head>
  <body class="page-world">
    <header class="site-top site-header language-header">
      <a class="skip-link" href="#app">Skip to the adventure</a>
      {{scriptSetting}}
      <a class="brand" href="./" aria-label="{{language}} Tone Tower home"
        ><svg viewBox="0 0 20 23" aria-hidden="true">
          <path d="M9 7V3H5V0h5v3h5V0h4v4h-6v4" fill="#80b79a" />
          <path d="M4 8h12v3h3v9h-3v3H4v-3H1v-9h3Z" fill="#edbd76" />
          <path d="M5 13h2v3H5m8-3h2v3h-2m-5 5h4v1H8" fill="#19293d" /></svg
        ><span class="brand-wordmark">
          <span>Tone Tower</span>
          <span class="site-language">{{language}}</span>
        </span></a
      >
      <nav aria-label="Main navigation">
        <a id="learn" class="nav-link" href="guide/" data-nav-page="sounds">{{guideName}}</a
        ><a id="about" class="nav-link" href="about/" data-nav-page="about">About</a>
      </nav>
    </header>
    <main id="app" tabindex="-1">
      <div class="loading-state">
        <span class="loading-sprout" aria-hidden="true">✦</span>
        <h1>{{language}} pronunciation practice</h1>
        <p>{{loading}}</p>
        <p>Loading your adventure…</p>
        <noscript><p>Enable JavaScript to play and listen to recordings.</p></noscript>
      </div>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <button
        id="close-dialog"
        class="dialog-close icon-button"
        type="button"
        aria-label="Close dialog"
      >
        ×
      </button>
      <div id="dialog-body"></div>
    </dialog>
    <script type="module" src="src/app.ts"></script>
  </body>
</html>
